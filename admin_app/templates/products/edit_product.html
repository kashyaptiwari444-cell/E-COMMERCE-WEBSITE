<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Product</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="bg-gradient-to-br from-slate-100 via-blue-50 to-slate-200 min-h-screen"
  >
    <div class="max-w-7xl mx-auto py-10 px-5">
      <!-- Header -->

      <div class="flex items-center justify-between mb-10">
        <div>
          <a
            href="{% url 'view_product' %}"
            class="inline-block px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
          >
            🔙 Back to Products
          </a>

          <h1 class="text-4xl font-bold text-gray-800 mt-4">Edit Product</h1>

          <p class="text-gray-500 mt-2">Update your product information.</p>
        </div>

        <div
          class="hidden md:flex h-16 w-16 rounded-2xl bg-blue-600 text-white items-center justify-center shadow-xl"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-8 h-8"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>
      </div>

      <form
        method="POST"
        enctype="multipart/form-data"
        action="{% url 'edit_product' product.id %}"
        class="bg-white rounded-3xl shadow-2xl border border-gray-200 overflow-hidden"
      >
        {% csrf_token %}

        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6">
          <h2 class="text-white text-2xl font-bold">Edit Product</h2>

          <p class="text-blue-100 mt-1">Update all product details.</p>
        </div>

        <div class="p-8">
          <div class="grid lg:grid-cols-2 gap-7">
            <!-- Product Name -->

            <div>
              <label class="font-semibold text-gray-700 mb-2 block">
                Product Name
              </label>

              <input
                type="text"
                name="product_name"
                value="{{ product.product_name }}"
                class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition"
              />
            </div>

            <!-- Slug -->

            <div>
              <label class="font-semibold text-gray-700 mb-2 block">
                Slug
              </label>

              <input
                type="text"
                name="slug"
                value="{{ product.slug }}"
                class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition"
              />
            </div>

            <!-- Category -->

            <div>
              <label class="font-semibold text-gray-700 mb-2 block">
                Category
              </label>

              <input
                type="text"
                name="category"
                value="{{ product.category.category_name }}"
                class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition"
              />
            </div>

            <!-- Sub Category -->

            <div>
              <label class="font-semibold text-gray-700 mb-2 block">
                Sub Category
              </label>

              <input
                type="text"
                name="subcategory"
                value="{{ product.subcategory.name }}"
                class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition"
              />
            </div>

            <!-- Brand -->

            <div>
              <label class="font-semibold text-gray-700 mb-2 block">
                Brand
              </label>

              <input
                type="text"
                name="brand"
                value="{{ product.brand.name }}"
                class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition"
              />
            </div>
            <!-- Stock -->

            <div>
              <label class="font-semibold text-gray-700 mb-2 block">
                Stock
              </label>

              <input
                type="number"
                name="stock"
                value="{{ product.stock }}"
                class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition"
              />
            </div>

            <!-- Price -->

            <div>
              <label class="font-semibold text-gray-700 mb-2 block">
                Price
              </label>

              <input
                type="number"
                name="price"
                value="{{ product.price }}"
                class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition"
              />
            </div>

            <!-- Discount Price -->

            <div>
              <label class="font-semibold text-gray-700 mb-2 block">
                Discount Price
              </label>

              <input
                type="number"
                name="discount_price"
                value="{{ product.discount_price }}"
                class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition"
              />
            </div>

            <!-- Rating -->

            <div>
              <label class="font-semibold text-gray-700 mb-2 block">
                Rating
              </label>

              <input
                type="number"
                step="0.1"
                name="rating"
                value="{{ product.rating }}"
                class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition"
              />
            </div>

            <!-- Status -->

            <div>
              <label class="font-semibold text-gray-700 mb-2 block">
                Status
              </label>

              <select
                name="status"
                class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition"
              >
              <option value="Active" {% if product.status %}selected{% endif %}>
                Active
            </option>

            <option value="Inactive" {% if not product.status %}selected{% endif %}>
                Inactive
            </option>
              </select>
            </div>
          </div>

          <!-- Description -->

          <div class="mt-8">
            <label class="font-semibold text-gray-700 block mb-2">
              Product Description
            </label>


            <textarea
                rows="6"
                name="description"
                class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 resize-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none">
                    {{product.description }}
            </textarea>

          </div>
          <!-- Current Image -->

          <div class="mt-8">
            <label class="font-semibold text-gray-700 block mb-3">
              Current Product Image
            </label>

            {% if product.image %}

            <div class="mb-5">
              <img
                src="{{ product.image.url }}"
                alt="{{ product.product_name }}"
                class="w-40 h-40 object-cover rounded-2xl border border-gray-300 shadow-lg"
              />
            </div>

            {% else %}

            <p class="text-red-500">No Image Available</p>

            {% endif %}
          </div>

          <!-- Upload New Image -->

          <div class="mt-8">
            <label class="font-semibold text-gray-700 block mb-3">
              Upload New Product Image
            </label>

            <label class="cursor-pointer">
              <div
                class="border-2 border-dashed border-blue-300 rounded-2xl p-10 bg-blue-50 hover:bg-blue-100 transition"
              >
                <div class="flex flex-col items-center">
                  <div
                    class="h-20 w-20 rounded-full bg-blue-600 flex items-center justify-center text-white text-4xl"
                  >
                    ⬆
                  </div>

                  <p class="mt-5 text-lg font-semibold text-gray-700">
                    Choose New Image
                  </p>

                  <p class="text-gray-500">PNG, JPG, JPEG</p>

                  <input type="file" name="image" class="hidden" />
                </div>
              </div>
            </label>
          </div>

          <!-- Buttons -->

          <div class="mt-10 flex justify-end gap-5">
            <button
              type="reset"
              class="px-8 py-3 rounded-xl border border-gray-300 hover:bg-gray-100 font-semibold"
            >
              Reset
            </button>

            <button
              type="submit"
              class="px-10 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold shadow-xl hover:scale-105 duration-300"
            >
              Update Product
            </button>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
