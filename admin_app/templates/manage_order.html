<html>
    <head>
        <title>Checkout</title>
        <link rel="stylesheet" href="{% static 'css/checkout.css' %}" />
    </head>
    
    <body>
        <div class="container">
        <h1>Checkout</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- DELIVERY ADDRESS -->
    
            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow">
            <h2 class="text-2xl font-bold mb-6">Delivery Address</h2>
    
            <form method="POST" action="{% url 'homepage' %}">
                {% csrf_token %}
    
                <div class="grid md:grid-cols-2 gap-5">
                <div>
                    <label for="name">Name</label>
                    <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ user.first_name }} {{ user.last_name }}"
                    required
                    />
                </div>
    
                <div>
                    <label for="email">Email</label>
                    <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ user.email }}"
                    required
                    />
                </div>
    
                <div>
                    <label for="phone">Phone</label>
                    <input
                    type="tel"
                    id="phone"
                    name="phone"
                    value="{{ user.profile.phone }}"
                    required
                    />
                </div>
    
                <div>
                    <label for="address">Address</label>
                    <input
                    type="text"
                    id="address"
                    name="address"
                    value="{{ user.profile.address }}"
                    required
                    />
                </div>
    
                <div>
                    <label for="city">City</label>
                    <input
                    type="text"
                    id="city"
                    name="city"
                    value="{{ user.profile.city }}"
                    required
                    />
                </div>
    
                <div>
                    <label for="state">State</label>
                    <input
                    type="text"
                    id="state"
                    name="state"
                    value="{{ user.profile.state }}"
                    required
                    />
                </div>
    
                <div>
                    <label for="zip_code">Zip Code</label>
                    <input
                    type="text"
                    id="zip_code"
                    name="zip

<div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
            <!-- ORDER SUMMARY -->

            <div
              class="xl:col-span-2 bg-white rounded-2xl border border-slate-200 shadow-sm"
            >
              <div
                class="p-6 border-b border-slate-200 flex justify-between items-center"
              >
                <div>
                  <h2 class="text-lg font-bold">Recent Orders</h2>

                  <p class="text-sm text-slate-500">Latest customer orders</p>
                </div>

                <a
                  href="#"
                  class="text-sm text-green-600 font-semibold hover:underline"
                >
                  View All
                </a>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left">
                  <thead class="bg-slate-50 text-sm text-slate-500">
                    <tr>
                      <th class="px-6 py-4">Order</th>
                      <th class="px-6 py-4">Customer</th>
                      <th class="px-6 py-4">Amount</th>
                      <th class="px-6 py-4">Status</th>
                    </tr>
                  </thead>

                  <tbody class="divide-y divide-slate-100">
                    <tr class="hover:bg-slate-50">
                      <td class="px-6 py-4 font-semibold">#ORD-1001</td>

                      <td class="px-6 py-4">Rahul</td>

                      <td class="px-6 py-4 font-semibold">₹2,499</td>

                      <td class="px-6 py-4">
                        <span
                          class="px-3 py-1 text-xs rounded-full bg-green-100 text-green-700"
                        >
                          Delivered
                        </span>
                      </td>
                    </tr>

                    <tr class="hover:bg-slate-50">
                      <td class="px-6 py-4 font-semibold">#ORD-1002</td>

                      <td class="px-6 py-4">Aman</td>

                      <td class="px-6 py-4 font-semibold">₹1,850</td>

                      <td class="px-6 py-4">
                        <span
                          class="px-3 py-1 text-xs rounded-full bg-yellow-100 text-yellow-700"
                        >
                          Processing
                        </span>
                      </td>
                    </tr>

                    <tr class="hover:bg-slate-50">
                      <td class="px-6 py-4 font-semibold">#ORD-1003</td>

                      <td class="px-6 py-4">Priya</td>

                      <td class="px-6 py-4 font-semibold">₹4,200</td>

                      <td class="px-6 py-4">
                        <span
                          class="px-3 py-1 text-xs rounded-full bg-blue-100 text-blue-700"
                        >
                          Shipped
                        </span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
