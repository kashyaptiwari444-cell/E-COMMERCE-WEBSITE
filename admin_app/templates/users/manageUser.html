<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <div class="p-8">
      <!-- Header -->
      <div class="flex justify-between items-center mb-6">
        <a
          href="{% url 'admin_dash' %}"
          class="inline-block text-center px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition"
        >
          🔙 GO Admin Dashboard 🔙
        </a>
        <h1 class="text-3xl font-bold text-gray-800">User Management</h1>

        <input
          type="text"
          placeholder="Search User..."
          class="border rounded-lg px-4 py-2 w-72 focus:ring-2 focus:ring-green-600 outline-none"
        />
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl shadow overflow-hidden">
        <table class="w-full">
          <thead class="bg-green-700 text-white">
            <tr>
            
              <th class="py-4">User</th>

              <th>Email</th>

              <th>Role</th>

              <th>Status</th>

              <th>Actions</th>
            </tr>
          </thead>

          <tbody class="text-center divide-y">
            <!-- User -->
            {% for user in users %}

            <tr class="hover:bg-gray-50">
              <td class="py-4">
                <div class="flex items-center justify-center gap-3">
                  {% if user.image %}
                  <img
                    src="{{ user.image.url }}"
                    alt="Profile"
                    class="w-12 h-12 rounded-full object-cover"
                  />
                  {% else %}
                  <img
                    src="/static/images/default-user.png"
                    alt="Profile"
                    class="w-12 h-12 rounded-full object-cover"
                  />
                  {% endif %}

                  <div>
                    <p class="font-semibold">{{ user.name }}</p>

                    <p class="text-gray-500 text-sm">
                      Joined: {{ user.created_at }}
                    </p>
                  </div>
                </div>
              </td>

              <td>{{ user.email }}</td>

              <td>
                <span
                  class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-semibold"
                >
                  Admin
                </span>
              </td>

              <td>
                <span
                  class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-semibold"
                >
                  Active
                </span>
              </td>

              <td>
                <div class="flex justify-center gap-2">
                  {% comment %}
                  <button
                    class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded"
                  >
                    Block
                  </button>

                  <button
                    class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded"
                  >
                    Delete
                  </button>

                  <button
                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded"
                  >
                    Edit
                  </button>
                  {% endcomment %}
                  <a
                    class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600"
                  >
                    Edit
                  </a>

                  <a
                    class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600"
                    onclick="
                      return confirm(
                        'Are you sure you want to delete this product?',
                      );
                    "
                  >
                    Delete
                  </a>
                  <a
                    class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-800"
                    onclick="
                      return confirm(
                        'Are you sure you want to delete this product?',
                      );
                    "
                  >
                    Block
                  </a>
                </div>
              </td>
            </tr>

            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
