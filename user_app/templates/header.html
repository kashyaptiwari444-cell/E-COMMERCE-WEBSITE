<!-- templates/components/navbar.html -->

<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <!-- Logo: Left -->
    <a
      href="{% url 'homepage' %}"
      class="text-3xl font-bold bg-gradient-to-r from-green-900 via-green-700 to-green-900 bg-clip-text text-transparent"
    >
      ApnaShop
    </a>

    <!-- Navigation: Center -->
    <div class="hidden md:flex items-center gap-8 font-semibold">
      <a
        href="{% url 'homepage' %}"
        class="text-gray-700 hover:text-green-700 transition"
      >
        Home
      </a>

      <a
        href="{% url 'my_order' %}"
        class="text-gray-700 hover:text-green-700 transition"
      >
        My Orders
      </a>

      <!-- Cart -->
      <a
        href="{% url 'cart' %}"
        class="relative flex items-center gap-2 text-gray-700 hover:text-green-700 transition"
      >
        <i class="fa-solid fa-cart-shopping text-xl"></i>
        <span>Cart</span>

        {% if cart_count > 0 %}
        <span
          class="absolute -top-3 -right-4 bg-red-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold"
        >
          {{ cart_count }}
        </span>
        {% endif %}
      </a>
    </div>

    <!-- Login / Logout: Right -->
    <div class="flex items-center gap-4 font-semibold">
      {% if user.is_authenticated %}
      <a
        href="{% url 'logout' %}"
        class="bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700 transition"
      >
        Logout
      </a>
      {% else %}
      <a
        href="{% url 'login' %}"
        class="bg-green-700 text-white px-5 py-2 rounded-lg hover:bg-green-800 transition"
      >
        Login
      </a>
      {% endif %}
    </div>
  </div>
</nav>
