<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | E-Library</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-teal-600 to-cyan-600 min-h-screen flex items-center justify-center">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8">

        <h2 class="text-3xl font-bold text-center text-teal-600 mb-6">
            Login
        </h2>

        <!-- Error Message -->
        <!-- Django:
        {% if error %}
        <div class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4">
            {{ error }}
        </div>
        {% endif %}
        -->

        <form method="POST">

            <!-- Django -->
             {% csrf_token %} 

            <div class="mb-5">

                <label class="block mb-2 font-semibold text-gray-700">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500">

            </div>

            <div class="mb-6">

                <label class="block mb-2 font-semibold text-gray-700">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500">

            </div>

            <button
                type="submit"
                class="w-full bg-teal-600 text-white py-3 rounded-lg font-semibold hover:bg-teal-700 transition">

                Login

            </button>

        </form>

        <div class="text-center mt-6">

            <p class="text-gray-600">
                New here?

                <a href="{% url 'register' %}" class="text-teal-600 font-semibold hover:underline">
                    Register
                </a>

            </p>

        </div>

    </div>

</body>
</html>
