<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{ view_products.product_name }} | Product Details</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #fff;
        color: #1f2937;
      }

      .container {
        width: 80%;
        max-width: 1200px;
        margin: auto;
      }

      /* Back Button */
      .back {
        display: inline-block;
        margin-top: 38px;
        margin-bottom: 45px;
        color: #ff5a00;
        text-decoration: none;
        font-size: 20px;
        font-weight: 500;
      }

      .back span {
        font-size: 30px;
        vertical-align: -2px;
        margin-right: 8px;
      }

      .back:hover {
        color: #e64d00;
      }

      /* Product Section */
      .product {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 52px;
        align-items: start;
        margin-bottom: 60px;
      }

      /* Product Image Box */
      .image-box {
        width: 100%;
        height: 610px;
        background: #f8fafc;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);

        display: flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;
      }

      /* Product Image */
      .product-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 25px;
        display: block;
      }

      /* Product Details */
      .details {
        padding-top: 5px;
      }

      .details h1 {
        font-size: 50px;
        line-height: 1.1;
        margin-bottom: 28px;
        color: #1f2937;
      }

      .description {
        font-size: 20px;
        color: #4b5563;
        margin-bottom: 38px;
        line-height: 1.5;
      }

      /* Rating */
      .rating {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 23px;
        margin-bottom: 35px;
      }

      .star {
        color: #fbbf24;
        font-size: 25px;
      }

      /* Category */
      .category {
        font-size: 19px;
        margin-bottom: 48px;
        color: #4b5563;
      }

      .category strong {
        color: #111827;
      }

      /* Price */
      .price {
        color: #ff4d00;
        font-size: 38px;
        font-weight: 700;
        margin-bottom: 42px;
      }

      /* Cart Button */
      .cart-btn {
        width: 100%;
        max-width: 350px;
        border: none;
        background: #14532d;
        color: white;
        padding: 18px 30px;
        border-radius: 15px;
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;

        text-decoration: none;
        transition: 0.3s ease;
      }

      .cart-btn:hover {
        background: #166534;
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(20, 83, 45, 0.25);
      }

      .cart-btn:active {
        transform: scale(0.97);
      }

      .cart-icon {
        font-size: 23px;
      }

      /* Responsive */
      @media (max-width: 900px) {
        .container {
          width: 90%;
        }

        .product {
          grid-template-columns: 1fr;
          gap: 35px;
        }

        .image-box {
          height: 450px;
        }

        .details h1 {
          font-size: 40px;
        }
      }

      @media (max-width: 500px) {
        .container {
          width: 92%;
        }

        .back {
          margin-top: 25px;
          margin-bottom: 25px;
          font-size: 18px;
        }

        .image-box {
          height: 330px;
          border-radius: 15px;
        }

        .product-image {
          padding: 15px;
        }

        .details h1 {
          font-size: 34px;
          margin-bottom: 18px;
        }

        .description {
          font-size: 17px;
          margin-bottom: 25px;
        }

        .rating {
          font-size: 19px;
          margin-bottom: 25px;
        }

        .category {
          margin-bottom: 30px;
        }

        .price {
          font-size: 32px;
          margin-bottom: 30px;
        }

        .cart-btn {
          max-width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Back -->
      <a href="{% url 'homepage' %}" class="back"> <span>←</span> Back </a>

      <!-- Product -->
      <div class="product">
        <!-- Image -->
        <div class="image-box">
          <img
            src="{{ view_products.image.url }}"
            alt="{{ view_products.product_name }}"
            class="product-image"
          />
        </div>

        <!-- Details -->
        <div class="details">
          <h1>{{ view_products.product_name }}</h1>

          <p class="description">{{ view_products.description }}</p>

          <!-- Rating -->
          <div class="rating">
            <span class="star">★</span>
            <span>{{ view_products.rating }}</span>
          </div>

          <!-- Category -->
          <div class="category">
            <strong>Category :</strong>
            {{ view_products.category }}
          </div>

          <!-- Price -->
          <div class="price">₹ {{ view_products.price }}</div>

          <!-- Add To Cart -->
          <a href="{% url 'add_to_cart' view_products.id %}" class="cart-btn">
            <span class="cart-icon">🛒</span>
            Add To Cart
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
